name: Release

# Push a tag like v1.0.0 to publish a release with the APK attached.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.BOOKS_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BOOKS_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Add the BOOKS_KEYSTORE_BASE64 and BOOKS_KEYSTORE_PASSWORD repository secrets first (see README)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/books.jks"
          echo "BOOKS_KEYSTORE_FILE=$RUNNER_TEMP/books.jks" >> "$GITHUB_ENV"
          echo "BOOKS_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew --console=plain :app:assembleRelease -PversionName="${GITHUB_REF_NAME#v}"

      - name: Name the APK after the version
        run: mv app/build/outputs/apk/release/app-release.apk "Books-${GITHUB_REF_NAME}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          files: Books-*.apk
          generate_release_notes: true
